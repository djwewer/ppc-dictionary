<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPC Glossary Trainer — Вхід</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="bg-orbs">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
</div>

<section class="page-center">
  <div class="login-card glass">
    <div class="logo">
      <span class="logo-mark">PPC</span>
      <span class="logo-text">Glossary Trainer</span>
    </div>
    <h1>Вивчи терміни PPC</h1>
    <p class="muted">Увійди своїм іменем та PIN-кодом, щоб зберігати прогрес у цьому браузері.</p>
    <form id="login-form">
      <label>
        Ім'я
        <input id="login-name" type="text" placeholder="Наприклад, Andrii" autocomplete="username" required />
      </label>
      <label>
        PIN-код (4–6 цифр)
        <input id="login-pin" type="password" inputmode="numeric" pattern="\d{4,6}" placeholder="••••" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="error"></p>
      <button type="submit" class="btn btn-primary btn-full">Увійти / створити профіль</button>
    </form>
    <p class="fine-print">Якщо такого імені ще немає — профіль створиться автоматично з цим PIN. Дані зберігаються локально у твоєму браузері.</p>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
